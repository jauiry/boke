<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="郏祥瑞的个人技术博客，分享软件测试、性能测试、接口自动化等技术文章" />
    <meta name="keywords" content="软件测试,性能测试,JMeter,接口测试,自动化测试,技术博客" />
    <meta name="author" content="郏祥瑞" />

    <!-- PWA -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mxqys" />
    <link rel="manifest" href="/manifest.json" />

    <!-- 预连接关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="郏祥瑞的技术博客" />
    <meta property="og:description" content="分享软件测试、性能测试、接口自动化等技术文章" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 站点地图 -->
    <link rel="sitemap" type="application/xml" title="站点地图" href="/api/sitemap.xml" />

    <title>郏祥瑞的技术博客 - 软件测试与性能测试</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
